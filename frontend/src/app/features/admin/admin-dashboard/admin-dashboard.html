<div class="dashboard-wrapper">
  <!-- 1. Top Summary Cards -->
  <div class="stats-grid">
    <div class="stat-card navy-border">
 
  <div class="stat-info">
    <span class="stat-label">Pending Tickets</span> <h2 class="stat-value">{{ pendingTicketsCount }}</h2> </div>
  <i class="stat-icon">🎫</i>
</div>

    
    <div class="stat-card orange-border">
      <div class="stat-info">
        <span class="stat-label">Total Assets Managed</span>
        <h2 class="stat-value">{{pieChartLabels.length}} Categories</h2>
      </div>
      <i class="stat-icon">💻</i>
    </div>
  </div>

  <h2 class="section-title">IT Analytics Overview</h2>

  <!-- 2. Charts Grid -->
  <div class="charts-container">
    
    <!-- Asset Distribution (Pie Chart) -->
    <div class="chart-card">
      <h3 class="chart-title">Asset Distribution</h3>
      <div class="chart-wrapper">
        <canvas baseChart
          [datasets]="pieChartDatasets"
          [labels]="pieChartLabels"
          [options]="pieChartOptions"
          type="pie"> 
        </canvas>
      </div>
    </div>

    <!-- Ticket Status Volume (Bar Chart) -->
    <div class="chart-card">
      <h3 class="chart-title">Ticket Status Volume</h3>
      <div class="chart-wrapper">
        <canvas baseChart
          [datasets]="barChartDatasets"
          [labels]="barChartLabels"
          [options]="barChartOptions"
          type="bar"> 
        </canvas>
      </div>
    </div>

  </div>
</div>
